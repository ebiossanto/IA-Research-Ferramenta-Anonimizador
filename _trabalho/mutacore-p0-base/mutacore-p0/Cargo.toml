[workspace]
resolver = "2"
members = [
  "crates/p0-domain",
  "crates/p0-policy",
  "crates/p0-obligation",
  "crates/p0-certificate",
  "crates/p0-verifier",
  "crates/p0-recovery",
  "crates/p0-decision",
  "crates/p0-capability",
  "crates/p0-gateway",
  "crates/p0-simulator",
  "crates/p0-observer",
  "crates/p0-agent",
  "crates/p0-synthesizer",
  "crates/p0-ledger",
  "crates/p0-runtime",
  "crates/p0-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
